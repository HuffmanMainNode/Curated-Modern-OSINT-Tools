name: Catalog integrity checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run catalog integrity tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate submodule metadata against tracked gitlinks
        run: python scripts/catalog_integrity.py --root . --output "$RUNNER_TEMP/catalog-integrity.json"
      - name: Publish catalog integrity summary
        run: |
          python -c "import json,sys; r=json.load(open(sys.argv[1], encoding='utf-8')); print(json.dumps({k:r[k] for k in ('submodule_count','unique_upstream_count','duplicate_url_group_count','errors','warnings')}, indent=2))" "$RUNNER_TEMP/catalog-integrity.json"
