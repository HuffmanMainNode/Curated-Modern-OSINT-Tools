name: Submodule integrity audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check update script syntax
        run: bash -n scripts/update_submodules.sh
      - name: Run submodule audit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit submodule mappings
        run: python scripts/audit_submodules.py --root . --output "$RUNNER_TEMP/submodule-audit.json"
      - name: Print audit summary
        run: |
          python -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); print(json.dumps({k:d[k] for k in ('gitlink_count','mapping_count','matched_count','duplicate_upstream_url_groups','errors','warnings')}, indent=2))" "$RUNNER_TEMP/submodule-audit.json"
